<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EngHub - Extensive English Reading</title>
    <meta name="description" content="EngHubはAIが毎日生成する英語の多読練習サイトです。レベル別、ジャンル別の英文を読み、1文ごとの日本語訳で理解を深めることができます。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>
    
    <header class="site-header">
        <div class="container header-content">
            <h1 class="logo">EngHub</h1>
            <p class="tagline">Daily English Reading Practice</p>
        </div>
    </header>

    <main class="container">
        <section class="controls glass-panel">
            <div class="control-group">
                <h2>Genre</h2>
                <div class="genre-selector" id="genreSelector">
                    <button class="genre-btn active" data-genre="All">All</button>
                    <button class="genre-btn" data-genre="Technology">Tech</button>
                    <button class="genre-btn" data-genre="Business">Business</button>
                    <button class="genre-btn" data-genre="Science">Science</button>
                    <button class="genre-btn" data-genre="Culture">Culture</button>
                    <button class="genre-btn" data-genre="Daily Life">Daily Life</button>
                </div>
            </div>
        </section>

        <section class="articles-container" id="articlesContainer">
            <div class="loading">Loading articles...</div>
        </section>
    </main>

    <footer class="site-footer glass-panel">
        <p>&copy; 2026 EngHub. Powered by AI.</p>
    </footer>

    <!-- Template for an article -->
    <template id="articleTemplate">
        <article class="article-card glass-panel">
            <header class="article-header">
                <div class="meta-badges">
                    <span class="badge genre-badge"></span>
                    <span class="badge date-badge"></span>
                    <span class="badge time-badge"></span>
                </div>
                <h2 class="article-title"></h2>
            </header>
            <div class="article-level-selector">
                <button class="local-level-btn active" data-level="1">Level 1</button>
                <button class="local-level-btn" data-level="2">Level 2</button>
                <button class="local-level-btn" data-level="3">Level 3</button>
                <button class="local-level-btn" data-level="4">Level 4</button>
                <button class="local-level-btn" data-level="5">Level 5</button>
            </div>
            <div class="article-content">
                <!-- Sentences will be injected here -->
            </div>
            <div class="article-actions">
                <button class="btn toggle-all-btn">Toggle All Translations</button>
            </div>
        </article>
    </template>

    <script src="js/app.js"></script>
</body>
</html>
